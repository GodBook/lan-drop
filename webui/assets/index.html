<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>LAN Drop - 局域网极简跨设备快传</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="logo-icon">⚡</div>
        <div>
          <h1>LAN Drop</h1>
        </div>
      </div>
      <div class="server-info">
        <span id="server-name">Loading...</span>
        <div class="desktop-actions" id="desktop-actions" hidden>
          <button class="icon-button" id="btn-desktop-open-folder" type="button" title="打开接收目录" aria-label="打开接收目录">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7h5l2 2h11v10H3z"></path><path d="M3 7V5h6l2 2"></path></svg>
          </button>
          <button class="icon-button" id="btn-desktop-copy-address" type="button" title="复制连接地址" aria-label="复制连接地址">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
          </button>
          <button class="icon-button" id="btn-desktop-settings" type="button" title="连接与存储设置" aria-label="连接与存储设置">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"></path></svg>
          </button>
        </div>
        <button class="btn-secondary btn-sm btn-qr" id="btn-show-qr" type="button" title="显示连接二维码" aria-haspopup="dialog" aria-controls="qr-modal" aria-expanded="false" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect width="5" height="5" x="3" y="3" rx="1"></rect>
            <rect width="5" height="5" x="16" y="3" rx="1"></rect>
            <rect width="5" height="5" x="3" y="16" rx="1"></rect>
            <path d="M16 16h2v2h-2zM21 16v5h-5M21 21h.01"></path>
          </svg>
          连接二维码
        </button>
        <div class="status-badge" id="conn-status">
          <span class="status-dot"></span>
          <span id="conn-text">已连接</span>
        </div>
      </div>
    </header>

    <!-- Main Content Grid -->
    <div class="main-grid">
      <!-- Left: Clipboard & Text Stream -->
      <div class="card">
        <div class="card-title">
          <span>📋 文本 & 剪贴板实时流</span>
          <span class="badge-count" id="text-count">0 条</span>
        </div>

        <div class="text-input-wrapper">
          <textarea id="text-input" placeholder="输入或粘贴文本、链接、代码，即刻跨设备同步..."></textarea>
          <div class="btn-group">
            <button class="btn-primary" id="btn-send-text">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              发送文本
            </button>
            <button class="btn-secondary" id="btn-paste-send">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
              粘贴并发送
            </button>
            <button class="btn-secondary btn-sm" id="btn-clear-text" style="margin-left: auto;">清空</button>
          </div>
        </div>

        <div class="text-feed-list" id="text-feed-list">
          <!-- Text items rendered here -->
        </div>
      </div>

      <!-- Right: File Drop & Management -->
      <div class="card">
        <div class="card-title">
          <span>📁 文件传输 & 接收</span>
          <span class="badge-count" id="file-count">0 个</span>
        </div>

        <!-- Dropzone -->
        <div class="dropzone" id="dropzone">
          <input type="file" id="file-input" multiple style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <div class="drop-tip">拖拽文件到此处，或点击选择</div>
          <div class="drop-sub">支持任意格式大文件分片秒传</div>
        </div>

        <!-- Active Upload Progress Queue -->
        <div class="upload-queue" id="upload-queue"></div>

        <!-- Downloaded File List -->
        <div class="file-toolbar" aria-label="文件筛选与批量操作">
          <label class="file-search">
            <span class="sr-only">搜索文件</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input id="file-search" type="search" placeholder="搜索文件" autocomplete="off">
          </label>
          <select id="file-type-filter" class="file-filter" aria-label="按文件类型筛选">
            <option value="all">全部类型</option>
            <option value="image">图片</option>
            <option value="video">视频</option>
            <option value="audio">音频</option>
            <option value="document">文档</option>
            <option value="archive">压缩包</option>
            <option value="other">其他</option>
          </select>
        </div>
        <div class="file-batch-bar">
          <label class="select-all-label">
            <input id="file-select-all" type="checkbox">
            <span>全选本页</span>
          </label>
          <button class="btn-danger btn-sm" id="btn-delete-selected" type="button" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path>
            </svg>
            删除所选
          </button>
        </div>
        <div class="file-list" id="file-list">
          <!-- File cards rendered here -->
        </div>
        <nav class="pagination" aria-label="文件分页">
          <button class="icon-button" id="btn-prev-page" type="button" title="上一页" aria-label="上一页">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          </button>
          <span id="page-status">第 1 / 1 页</span>
          <button class="icon-button" id="btn-next-page" type="button" title="下一页" aria-label="下一页">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
        </nav>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- PIN Modal -->
  <div class="modal-overlay" id="pin-modal" style="display: none;">
    <div class="modal">
      <h2>🔒 请输入 4 位访问 PIN 码</h2>
      <p style="color: var(--text-muted); font-size: 13px;">请查看服务端终端屏幕上显示的 PIN 码或直接扫码免密进入</p>
      <input type="password" id="pin-input" class="pin-input" maxlength="6" autofocus placeholder="••••">
      <button class="btn-primary" id="btn-submit-pin" style="width: 100%;">确认进入</button>
    </div>
  </div>

  <!-- Media Preview Modal -->
  <div class="modal-overlay preview-overlay" id="preview-modal" style="display: none;">
    <div class="preview-body" id="preview-body"></div>
  </div>

  <!-- Connect QR Modal -->
  <div class="modal-overlay" id="qr-modal" role="dialog" aria-modal="true" aria-labelledby="qr-title" style="display: none;">
    <div class="modal qr-modal">
      <div class="qr-modal-header">
        <h2 id="qr-title">手机连接</h2>
        <button class="icon-button" id="btn-close-qr" type="button" title="关闭" aria-label="关闭二维码">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="qr-image-box">
        <div class="qr-loading" id="qr-loading" role="status">正在生成二维码...</div>
        <img id="qr-image" width="232" height="232" alt="LAN Drop 手机连接二维码" hidden>
      </div>
      <div class="qr-details" id="qr-details" hidden>
        <div class="qr-detail-label">连接地址</div>
        <div class="qr-address-row">
          <code class="qr-url" id="qr-url"></code>
          <button class="icon-button qr-copy-button" id="btn-copy-qr-url" type="button" title="复制连接地址" aria-label="复制连接地址">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect width="14" height="14" x="8" y="8" rx="2"></rect>
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
            </svg>
          </button>
        </div>
        <div class="qr-pin-hint" id="qr-pin-hint"></div>
      </div>
    </div>
  </div>

  <!-- Native desktop settings -->
  <div class="modal-overlay" id="desktop-settings-modal" role="dialog" aria-modal="true" aria-labelledby="desktop-settings-title" style="display: none;">
    <div class="modal desktop-settings-modal">
      <div class="qr-modal-header">
        <h2 id="desktop-settings-title">连接与存储</h2>
        <button class="icon-button" id="btn-close-desktop-settings" type="button" title="关闭" aria-label="关闭设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </div>
      <label class="settings-field">
        <span>局域网网卡</span>
        <select id="desktop-adapter-select"></select>
      </label>
      <div class="settings-field">
        <span>接收目录</span>
        <div class="settings-value-row">
          <code id="desktop-upload-dir"></code>
          <button class="btn-secondary btn-sm" id="btn-desktop-change-folder" type="button">更改</button>
        </div>
      </div>
      <div class="settings-field">
        <span>连接地址</span>
        <code id="desktop-connect-url"></code>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
