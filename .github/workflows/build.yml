name: Build & Release Binaries

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile for all platforms
        run: |
          mkdir -p dist
          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/landrop-windows-amd64.exe .
          # macOS Apple Silicon
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/landrop-darwin-arm64 .
          # macOS Intel
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/landrop-darwin-amd64 .
          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/landrop-linux-amd64 .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: landrop-binaries
          path: dist/*

      - name: Create GitHub Release with binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
