plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.godbook.landrop'
    compileSdk 34

    defaultConfig {
        applicationId "com.godbook.landrop"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4.0"
    }

    // Stable release signing so APK updates install over previous versions.
    // The keystore is committed on purpose: LAN Drop is a local network tool,
    // not a store-distributed app, and losing the key would force uninstalls.
    signingConfigs {
        release {
            storeFile file('landrop.keystore')
            storePassword 'landrop123'
            keyAlias 'landrop'
            keyPassword 'landrop123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
