plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseSigningEnv = [
    keystorePath: System.getenv('LANDROP_KEYSTORE_PATH'),
    storePassword: System.getenv('LANDROP_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('LANDROP_KEY_ALIAS'),
    keyPassword: System.getenv('LANDROP_KEY_PASSWORD')
]
def configuredSigningValues = releaseSigningEnv.values().count { it != null && !it.isBlank() }
def hasReleaseSigning = configuredSigningValues == releaseSigningEnv.size()
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}

android {
    namespace 'com.godbook.landrop'
    compileSdk 34

    defaultConfig {
        applicationId "com.godbook.landrop"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.5.1"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigningEnv.keystorePath)
                storeType 'PKCS12'
                storePassword releaseSigningEnv.storePassword
                keyAlias releaseSigningEnv.keyAlias
                keyPassword releaseSigningEnv.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

if (configuredSigningValues > 0 && !hasReleaseSigning) {
    throw new GradleException('Android release signing is only partially configured. Set LANDROP_KEYSTORE_PATH, LANDROP_KEYSTORE_PASSWORD, LANDROP_KEY_ALIAS and LANDROP_KEY_PASSWORD together.')
}
if (releaseTaskRequested && !hasReleaseSigning) {
    throw new GradleException('Android release builds require signing credentials from the LANDROP_KEYSTORE_* and LANDROP_KEY_* environment variables.')
}
if (hasReleaseSigning && !file(releaseSigningEnv.keystorePath).isFile()) {
    throw new GradleException("Android release keystore does not exist: ${releaseSigningEnv.keystorePath}")
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
}
